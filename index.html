<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priyanshu Exploit</title>
    <style>
        /* Intro Animation */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #00ff00; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem; font-weight: bold; text-transform: uppercase;
            letter-spacing: 3px; animation: fadeOut 1.5s ease-in-out 2.5s forwards;
        }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        /* Tumhara Original CSS */
        body { background-color: #000; color: #00ff00; font-family: 'Courier New', Courier, monospace; margin: 0; }
        .container { padding: 20px; text-align: center; }
        .app-card { background: #111; border: 1px solid #00ff00; padding: 20px; border-radius: 10px; margin: 10px; display: inline-block; width: 280px; }
        .download-btn { background: #ff0000; color: #fff; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        #matrixCanvas { position: fixed; top: 0; left: 0; z-index: -1; }
    </style>
</head>
<body>

    <!-- Naya Intro Animation -->
    <div id="intro-overlay">Priyanshu Exploit</div>

    <canvas id="matrixCanvas"></canvas>

    <div class="container">
        <h1>Priyanshu Exploit</h1>
        <div class="app-card">
            <h3>App Name</h3>
            <p>Description here</p>
            <button class="download-btn" onclick="alert('Downloading...')">Download</button>
        </div>
    </div>

    <script>
        // Tumhara Original JS Matrix Effect
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const matrix = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789";
        const drops = Array(Math.floor(canvas.width / 20)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            drops.forEach((y, i) => {
                const text = matrix[Math.floor(Math.random() * matrix.length)];
                ctx.fillText(text, i * 20, y * 20);
                if (y * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 50);
    </script>
</body>
</html>
