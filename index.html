        // 1. डार्क/लाइट मोड स्क्रिप्ट
        const themeBtn = document.getElementById('themeBtn');
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeBtn.textContent = '🌓 LIGHT MODE';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');

        // 2. लाइव सर्च बार स्क्रिप्ट (Real-time Filtering)
        const searchInput = document.getElementById('searchInput');
        const appCards = document.querySelectorAll('.app-card');

        searchInput.addEventListener('input', (e) => {
            const searchText = e.target.value.toLowerCase().trim();
            
            appCards.forEach(card => {
                const appTitle = card.querySelector('.app-title').textContent.toLowerCase();

                if (appTitle.includes(searchText) || appCategory.includes(searchText)) {
